<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technology Web Apps Gateway</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
    :root {
        --ink: #1c1d2e;
        --sub: #55576e;
        --border: #d9dae8;
        --accent: #4b3fae;
        --accent-soft: #efedfb;
    }
    * { box-sizing: border-box; }
    body {
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        color: var(--ink);
        background: #fff;
    }
    .banner {
        position: relative;
        width: 100%;
        height: 300px;
        overflow: hidden;
    }
    .banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .banner .title {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        margin: 0;
        font-size: 34px;
        font-weight: 600;
        text-align: center;
        text-shadow: 0 2px 12px rgba(0,0,0,0.45);
    }
    main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 40px 32px 20px;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }
    @media (max-width: 780px) {
        .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px) {
        .grid { grid-template-columns: 1fr; }
        .banner .title { font-size: 24px; }
    }
    .card {
        display: block;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        text-decoration: none;
        color: inherit;
        transition: box-shadow 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover {
        box-shadow: 0 8px 24px rgba(28, 29, 46, 0.10);
        border-color: var(--accent);
        transform: translateY(-2px);
    }
    .icon {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: var(--accent-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
    }
    .icon svg {
        width: 20px;
        height: 20px;
        stroke: var(--accent);
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    .card h2 {
        font-size: 16px;
        margin: 0 0 6px;
    }
    .card p {
        font-size: 14px;
        color: var(--sub);
        margin: 0;
        line-height: 1.4;
    }
    footer {
        max-width: 1040px;
        margin: 20px auto 50px;
        padding: 0 32px;
        text-align: center;
    }
    footer p {
        color: #236fa1;
        font-style: italic;
        font-size: 14px;
    }
</style>
</head>
<body>

<div class="banner">
    <img src="4x1-banner.jpg" alt="">
    <h1 class="title">Technology Information Gateway</h1>
</div>

<main>
    <div class="grid">

        <a class="card" href="/roadmap/index.html" target="_blank" rel="noopener">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg></span>
            <h2>Technology Delivery Roadmap</h2>
            <p>Technology feature delivery by month</p>
        </a>

        <a class="card" href="/project-list/index.html" target="_blank" rel="noopener">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg></span>
            <h2>Projects Listing</h2>
            <p>Sortable table of open projects</p>
        </a>

     </div>
</main>

<footer>
    <p>Information is always subject to change! See our Mintranet pages for process flows.</p>
</footer>

</body>
</html>
